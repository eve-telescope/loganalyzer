# The integration suites (tests/integration) share one process and one
# database; they clean the tables they assert about, so tests must never
# run concurrently.
[env]
RUST_TEST_THREADS = "1"
# The parser runs on PCRE2 like PHP's preg_* functions: the bundled copy,
# linked statically, so every build (host, docker, CI) runs the same
# library version.
PCRE2_SYS_STATIC = "1"
