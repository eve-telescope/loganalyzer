# The integration suites (tests/integration) share one process and one
# database; they clean the tables they assert about, so tests must never
# run concurrently.
[env]
RUST_TEST_THREADS = "1"
# The parser runs on the bundled PCRE2, linked statically, so every
# build (host, docker, CI) runs the same library version.
PCRE2_SYS_STATIC = "1"
