[package]
name = "loganalyzer"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "loganalyzer.eve-telescope.com: upload an EVE Online combat log and get a shareable analysis"
default-run = "loganalyzer"

[dependencies]
axum = { version = "0.8", features = ["multipart"] }
# The ASCII fallback name of downloads (Content-Disposition).
deunicode = "1"
dotenvy = "0.15"
# The raw logs are stored gzipped (`{uuid}.txt.gz`), level 9 like before.
flate2 = "1"
form_urlencoded = "1"
percent-encoding = "2"
# The parser keeps PHP's regular expressions as they are: PCRE2 with
# UTF and UCP, the engine behind `preg_*` and the `/u` flag.
pcre2 = "0.2"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sqlx = { version = "0.9", features = [
    "runtime-tokio",
    "tls-rustls",
    "postgres",
    "migrate",
    "time",
    "uuid",
] }
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "fs", "signal", "net"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
# ESI answers names in NFC; the names of the log are matched against
# that form.
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
# Hashes of recorded bodies and static files.
sha2 = "0.10"
flate2 = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[[bin]]
name = "loganalyzer"
path = "src/main.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "seed_samples"
path = "src/bin/seed_samples.rs"

[[bin]]
name = "parse_logs"
path = "src/bin/parse_logs.rs"

# Handlers return `Result<_, Response>`, as in MutaMarket.
[lints.clippy]
result_large_err = "allow"

# The parser suites run PCRE2 over megabytes of fixtures; optimized
# dependencies keep `cargo test` fast.
[profile.dev.package."*"]
opt-level = 2
